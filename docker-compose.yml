services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    # In-memory storage: every run starts with an empty database
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build: ./back
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=booking_system;Username=postgres;Password=postgres"
      Cors__AllowedOrigins__0: "http://localhost:8080"
    ports:
      - "5093:8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: "http://localhost:5093/"
    ports:
      - "8080:80"
    depends_on:
      - back
